name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # No dependencies to install: redos-db is zero-dependency by design.
      # Python-engine entries are verified against CPython's own `re` module.
      - name: Rebuild database (validates schema + measures every entry)
        run: node lib/build.js
      - name: Test (schema + measured blow-up + class label)
        run: node --test
      - name: Fail if dist/redos-db.json is stale
        run: |
          if ! git diff --quiet -- dist/redos-db.json; then
            echo "dist/redos-db.json is out of date — run 'npm run build' and commit it." >&2
            git --no-pager diff -- dist/redos-db.json | head -40
            exit 1
          fi

  action:
    # Smoke-test the composite GitHub Action end to end against a fixture that
    # pins a known-vulnerable dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a fixture with a vulnerable dependency
        run: |
          mkdir -p fixture
          cat > fixture/package-lock.json <<'JSON'
          {"name":"fixture","lockfileVersion":3,"packages":{"node_modules/ansi-regex":{"version":"5.0.0"}}}
          JSON
      - name: Run redos-db audit action (report-only)
        id: audit
        uses: ./
        with:
          path: fixture
          fail-on-findings: 'false'
      - name: Assert the action found the vulnerable dependency
        run: |
          echo "findings=${{ steps.audit.outputs.findings }}"
          test "${{ steps.audit.outputs.findings }}" -ge 1
